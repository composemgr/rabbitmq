# nginx proxy address - http://172.17.0.1:64321

name: rabbitmq
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: rabbitmq
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: rabbitmq-app
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      RABBITMQ_DEFAULT_USER: ${DB_ADMIN_NAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${DB_ADMIN_PASS:-replace-with-a-random-password}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - './volumes/db/rabbitmq/rabbitmq:/var/lib/rabbitmq:z'
      - './volumes/config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - rabbitmq

networks:
  rabbitmq:
    name: rabbitmq
    external: false
